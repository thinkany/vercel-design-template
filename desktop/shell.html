        gap: 5px; flex: 1; min-width: 0; padding: 9px 10px 9px 0; }
      .adrec-hasthumb .adrec-title { flex: none; }
      .adrec-hasthumb .adrec-kind { flex: none; }
      /* The eye marker floats over the crop's corner on a card (the text column has no room
         for it), and stays an inline row affordance when there's no crop. */
      .adrec-hasthumb { position: relative; }
      .adrec-hasthumb.adrec-anchored::after { position: absolute; left: 8px; top: 8px; width: 15px; height: 15px;
        background-color: rgba(255,255,255,.92); border-radius: 50%; padding: 0; opacity: .95;
        background-size: 11px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
      .adrec-anchored::after { content: ""; flex: 0 0 auto; width: 13px; height: 13px; opacity: .55;
        background: no-repeat center/13px url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d97706' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z'/%3E%3Ccircle cx='12' cy='12' r='2.6'/%3E%3C/svg%3E"); }
      .adrec-anchored:hover::after { opacity: 1; }
      .adrec-dismissed { background: #fafafb; cursor: pointer; }
      .adrec-dismissed .adrec-title { color: #666666; }
      .adrec-restore { flex: 0 0 auto; border: 1px solid #d8d8de; background: none; color: #555; border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 11px; cursor: pointer; }
      .adrec-restore:hover { border-color: #111; color: #111; }
      .adrec-done { background: #f6faf7; cursor: pointer; }
      .adrec-done .adrec-title { color: #6b7d70; }
      .adrec-donetag { flex: 0 0 auto; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; color: #1a6b3a; background: #e7f4ec; }
      .adrec-archive { margin-top: 16px; border-top: 1px solid #ececf1; padding-top: 10px; }
      .adrec-archive > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: #777; text-transform: uppercase; letter-spacing: .04em; list-style: none; }
      .adrec-archive > summary::-webkit-details-marker { display: none; }
      .adrec-archive[open] > summary { margin-bottom: 8px; }
      /* Recommendation modal */
      .adrec-overlay { position: fixed; inset: 0; z-index: 1200; background: rgba(20,20,24,.4); display: flex; align-items: center; justify-content: center; padding: 24px; }
      .adrec-modal { background: #fff; border-radius: 12px; max-width: 460px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
      .adrec-modal-title { font-size: 16px; font-weight: 600; color: #111; line-height: 1.3; }
      .adrec-modal-kind { display: inline-block; margin-top: 8px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; }
      .adrec-modal-why { font-size: 13.5px; color: #333; line-height: 1.5; margin-top: 12px; }
      /* Accessibility review: impact chips + the flagged-element list in the finding modal. */
      .a11y-impact-critical { background: #fde8e6; color: #c0261e; }
      .a11y-impact-serious  { background: #fdeee6; color: #b4530a; }
      .a11y-impact-moderate { background: #fff6e0; color: #8a6d1a; }
      .a11y-impact-minor    { background: #eef0f2; color: #555; }
      .a11y-instances { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; }
      .a11y-inst { border-left: 2px solid #ececf1; padding: 2px 0 2px 10px; }
      .a11y-inst-sel { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #444; word-break: break-all; }
      .a11y-inst-why { font-size: 12px; color: #777; line-height: 1.45; margin-top: 3px; }
      .a11y-inst-more { font-size: 12px; color: #737373; font-style: italic; }
      /* "Show on page" review toolbar — floats over the preview while stepping through the
         highlighted failing elements. */
      #a11y-toolbar, #ad-toolbar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; align-items: center; gap: 10px; background: #17171b; color: #fff; border-radius: 999px; padding: 6px 8px 6px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.32); font-size: 12.5px; }
      #a11y-toolbar[hidden], #ad-toolbar[hidden] { display: none; }
      .a11y-tb-title { font-weight: 600; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .a11y-tb-count { color: #74747a; margin-right: 4px; white-space: nowrap; flex-shrink: 0; }
      #a11y-toolbar .a11y-tb-btn, #ad-toolbar .a11y-tb-btn { flex-shrink: 0; }
      .a11y-tb-btn { border: none; background: #2a2a32; color: #fff; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; transition: background .12s; }
      .a11y-tb-btn:hover { background: #3a3a44; }
      .a11y-tb-btn:disabled { opacity: .4; cursor: default; }
      .a11y-tb-fix { background: #0a7; }          /* the green CTA — fix the highlighted issue */
      .a11y-tb-fix:hover { background: #0b8a63; }
      .a11y-tb-fix:disabled:hover { background: #0a7; }
      .a11y-tb-exit { background: #2a2a32; }      /* neutral so Fix is the standout action */
      .a11y-tb-exit:hover { background: #3a3a44; }
      /* AD review bar only: FIXED width + a constant (non-pill) corner radius, so opening only
         grows the height via a soft dropdown below a fixed top row. It stays a rounded
         rectangle the whole way and the truncated title never moves. AA bar keeps its pill.
         PLACEMENT: it covers the CHAT pane rather than floating over the preview — the walk is
         about looking at the design, and a bar sitting on top of the design hid the very thing
         it was pointing at. placeAdToolbar measures the pane and publishes its box as
         --chat-x / --chat-w (re-measured on open, on a divider drag and on a window resize).
         When the chat is collapsed (width 0) there is no pane to sit on, so the bar falls back
         to floating centered over the preview. */
      #ad-toolbar { flex-direction: column; align-items: stretch; gap: 0; width: min(600px, 92vw); border-radius: 18px; padding: 8px 8px 8px 16px; }
      #ad-toolbar.over-chat {
        /* Anchored to the pane's MEASURED box (placeAdToolbar publishes both edges) — the pane
           sits after the rail, so a window-relative left would land the bar on the rail. */
        left: calc(var(--chat-x, 56px) + 12px); transform: none;
        top: 63px;  /* clear of the chat's own dark #bar (51px) — the two are near-identical
                       darks, so overlapping them read as one smeared block */
        width: calc(var(--chat-w, 400px) - 24px);
        max-height: calc(100vh - 77px);
      }
      /* One row, never wrapped: the count takes the slack on the left and truncates if it must,
         so Prev/Next/Exit stay together on the right (a wrapped row stranded Exit alone). */
      #ad-toolbar.over-chat .ad-tb-row { flex-wrap: nowrap; }
      #ad-toolbar.over-chat .a11y-tb-count { font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      /* The dropdown gets the pane's height instead of being a compact strip: the panel
         scrolls internally, so a long why + the make-the-call field stay reachable without
         the whole bar growing past the viewport. */
      #ad-toolbar.over-chat .ad-tb-panel { max-height: calc(100vh - 200px); overflow-y: auto; }
      /* Narrow pane: three actions side by side (Dismiss + Source imagery + Make the call)
         would each get ~110px and clip their labels. Stack them instead, full width, in
         priority order — a column reads cleanly at this width where a ragged wrap doesn't. */
      #ad-toolbar.over-chat .adrec-action-split { flex-direction: column; align-items: stretch; gap: 8px; }
      #ad-toolbar.over-chat .adrec-action-split > button { flex: 0 0 auto; width: 100%; }
      /* Dismiss is the quiet answer, so it goes LAST in the stack (visual order only) and
         keeps its outline treatment while the primary action leads. */
      #ad-toolbar.over-chat .ad-tb-actions .adrec-dismiss-btn { order: 2; flex: 0 0 auto; margin-right: 0; }
      /* The row is just the count + the step/exit buttons now: the rec's title lives in the
         panel below, where it wraps in full instead of truncating. */
      .ad-tb-row { display: flex; align-items: center; gap: 10px; }
      .ad-tb-count-lead { margin-right: auto; }
      /* The panel is ALWAYS open — the bar owns the chat pane, so there is nothing to reclaim
         by collapsing it. It's light so it can reuse the modal's light action buttons + field
         on the otherwise-dark bar, and it grows on its own when make-the-call opens inside. */
      .ad-tb-drop { margin-top: 10px; }
      /* The bar's padding is 16px left / 8px right; the card pulls left 8px so it sits centered. */
      #ad-toolbar .ad-tb-drop { margin-left: -8px; }
      .ad-tb-drop-inner { min-height: 0; }
      .ad-tb-panel { background: #fff; border-radius: 10px; padding: 14px 16px; color: #1a1a1a; }
      .ad-tb-drop-title { font-weight: 600; font-size: 13.5px; line-height: 1.4; color: #1a1a1a; }
      .ad-tb-why { color: #555; font-size: 12.5px; line-height: 1.5; margin-top: 6px; }
      /* Dismiss rides along on every rec in the walk, but it's the secondary answer: it sizes
         to its label and sits left, leaving the primary action the rest of the row. On a rec
         with no primary action it's alone, and stays its own width rather than stretching. */
      .ad-tb-actions .adrec-dismiss-btn { flex: 0 0 auto; margin-right: auto; }
      /* Inline font-pick for an actionable type 'decision' (reuses .ifonts / .ifont) */
      .adrec-fontpick-label { font-size: 12.5px; color: #6a6a72; margin-top: 14px; }
      .adrec-fontpick { margin-top: 8px; max-height: 260px; overflow-y: auto; }
      .adrec-modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
      .adrec-apply-btn { margin-left: auto; border: none; background: #111; color: #fff; border-radius: 8px; padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .12s; }
      .adrec-apply-btn:hover { opacity: .88; }
      .adrec-apply-btn:disabled { background: #c9c9d0; color: #fff; cursor: not-allowed; }
      .adrec-apply-btn:disabled:hover { opacity: 1; }
      .adrec-hold-btn { border: none; background: none; color: #666; border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 13px; cursor: pointer; transition: color .12s; }
      .adrec-hold-btn:hover { color: #111; }
      .adrec-dismiss-btn { border: 1px solid #d8d8de; background: none; color: #444; border-radius: 8px; padding: 9px 16px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .12s, color .12s; }
      .adrec-dismiss-btn:hover { border-color: #111; color: #111; }
      /* "Show on page" — grouped with Fix on the right, in our green. */
      .a11y-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .a11y-right .adrec-apply-btn { margin-left: 0; }
      .a11y-show-btn { border: none; background: #0a7; color: #fff; border-radius: 8px; padding: 9px 16px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .12s; }
      .a11y-show-btn:hover { opacity: .88; }
      .adrec-modal-tagnote { margin-left: auto; font-size: 12px; color: #68686e; }
      /* Same soft gray + size as the tagnote, but its own paragraph under the description. */
      .adrec-modal-note { font-size: 12px; color: #68686e; line-height: 1.5; margin-top: 10px; }
      /* "Make the call" — a secondary/outlined action so it never fights the dark primary
         (e.g. Source imagery) when both appear on a sourceable asset. */
      .adrec-makecall-btn { border: 1px solid #d8d8de; background: none; color: #444; border-radius: 8px; padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .12s, color .12s; }
      .adrec-makecall-btn:hover, .adrec-makecall-btn.active { border-color: #111; color: #111; }
      .adrec-makecall-btn:disabled { opacity: .5; cursor: not-allowed; }
      /* Source imagery — a softer gray (not aggressive black) since it's an alternative,
         not the single primary action. */
      .adrec-source-btn { border: none; background: #6a6a72; color: #fff; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s; }
      .adrec-source-btn:hover { background: #55555c; }
      .adrec-source-btn:disabled { background: #c9c9d0; cursor: not-allowed; }
      /* Two actions (Source imagery + Make the call) on their own row, split evenly. Matched
         to the other buttons' height (not the taller default). */
      .adrec-action-split { display: flex; gap: 8px; margin-top: 12px; }
      .adrec-action-split > button { flex: 1 1 0; margin-left: 0; padding: 8px 16px; text-align: center; }
      /* "Make the call" field — soft-animated open (grid-rows eases to the exact height). */
      .adrec-makecall { display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: 0; transition: grid-template-rows .3s ease, opacity .25s ease, margin-top .3s ease; }
      .adrec-makecall.open { grid-template-rows: 1fr; opacity: 1; margin-top: 14px; }
      .adrec-makecall-inner { overflow: hidden; }
      .adrec-makecall-input { width: 100%; box-sizing: border-box; border: 1px solid #d8d8de; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 13px; line-height: 1.5; color: #1a1a1a; resize: vertical; min-height: 68px; }
      .adrec-makecall-input:focus { outline: none; border-color: #111; }
      .adrec-makecall-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      .adrec-upload-btn { flex-shrink: 0; border: 1px solid #d8d8de; background: none; color: #444; border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .12s, color .12s; }
      .adrec-upload-btn:hover { border-color: #111; color: #111; }
      .adrec-upload-name { flex: 1 1 auto; min-width: 0; font-size: 12px; color: #68686e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Rail cue: a dot whenever the current design has active recommendations queued. Red
         when any are actionable (code); white when only "needs an asset" / "your call" remain. */
      #rail-artdirector.has-code::before, #rail-a11y.has-code::before,
      #rail-artdirector.has-passive::before, #rail-a11y.has-passive::before { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; }
      #rail-artdirector.has-code::before, #rail-a11y.has-code::before { background: #c0261e; }
      #rail-artdirector.has-passive::before, #rail-a11y.has-passive::before { background: #fff; }
      .qopt.qupload { border-color: #111; background: #f4f4f7; }
      /* Once a file is attached, match every other chosen option: black fill, white
         text (the .qupload base background would otherwise keep it light and hide
         the now-white label). */
      .qopt.qupload.selected { border-color: #111; background: #111; }
      .qopt.qupload.drag { border-color: #7b7bea; background: #f0f0ff; } /* references drag-over */
      .qupload-note { font-size: 12px; color: #0a7; margin: -2px 0 8px; min-height: 14px; }

      /* ---- Welcome path picker (fresh-start chips) ---- */
      .welcome-card { border-color: #d8d8de; }
      .welcome-title { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
      .welcome-card .qopt:last-child { margin-bottom: 0; }
      .welcome-opt { display: flex; align-items: center; gap: 11px; }
      /* Choice icons follow the rail convention to keep the brand intact:
         1px stroke, currentColor (black here). Rule enforced in CSS so any
         future choice icon inherits it regardless of its own attributes. */
      .welcome-icon { flex-shrink: 0; width: 22px; height: 22px; color: #111; }
      .welcome-icon svg { width: 22px; height: 22px; display: block; stroke-width: 1; }

      /* Inline color swatch for hex codes in chat */
      .swatch {
        display: inline-block; width: 11px; height: 11px; border-radius: 3px;
        border: 1px solid rgba(0,0,0,.18); margin: 0 3px -1px 0; vertical-align: baseline;
      }
      /* Inline markdown in chat messages */
      .msg strong { font-weight: 700; }
      .msg code {
        font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px;
        background: #f0f0f3; padding: 1px 4px; border-radius: 4px;
      }

      #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e3e3; align-items: stretch; position: relative; }
      /* Jump-to-latest affordance: a 1px-stroke circle with a down caret, floating in
         the chat pane's lower-right just above the composer. Anchored to the composer's
         top edge so it stays put as the textarea grows. Fades in only when the log is
         scrolled up from the newest message. */
      #scrolldown {
        position: absolute; top: -46px; right: 14px; width: 30px; height: 30px;
        border-radius: 50%; border: 1px solid #c8c8cf; background: #fff; color: #555;
        display: flex; align-items: center; justify-content: center; padding: 0;
        cursor: pointer; opacity: 0; pointer-events: none;
        transition: opacity .25s ease, border-color .18s ease, color .18s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      }
      #scrolldown.show { opacity: 1; pointer-events: auto; }
      #scrolldown:hover { border-color: #111; color: #111; }
      #scrolldown svg { width: 16px; height: 16px; }
      /* Left column: Command button (top) stacked over the Attach button (bottom half) */
      #composer-left { position: relative; display: flex; flex-direction: column; gap: 4px; }
      #cmdbtn, #attach {
        flex: 1; min-height: 0; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
        border: 1px solid #d8d8de; background: #fafafb; color: #555; border-radius: 7px; cursor: pointer; padding: 0 8px;
        transition: border-color .25s linear, background .25s linear, color .25s linear;
      }
      #cmdbtn:hover, #cmdbtn[aria-expanded="true"], #attach:hover { border-color: #111; color: #111; }
      #cmdbtn .cmd-ic { width: 16px; height: 16px; }
      #attach svg { width: 16px; height: 16px; display: block; }
      /* "Commands" popover — opens upward from the left column */
      #cmdmenu {
        position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 30;
        width: 320px; background: #fff; border: 1px solid #e0e0e6; border-radius: 10px;
        box-shadow: 0 10px 34px rgba(0,0,0,.16); padding: 6px; max-height: 300px; overflow-y: auto;
      }
      #cmdmenu[hidden] { display: none; }
      .cmdmenu-item { display: block; width: 100%; text-align: left; border: none; background: none; border-radius: 7px; padding: 7px 9px; cursor: pointer; font: inherit; transition: background .15s linear; }
      .cmdmenu-item:hover { background: #f4f4f7; }
      .cmdmenu-item .cmd { font-size: 12.5px; font-weight: 600; color: #1a1a1a; }
      .cmdmenu-item .desc { font-size: 11.5px; color: #666666; margin-top: 1px; line-height: 1.35; }
      #log.dragover { outline: 2px dashed #111; outline-offset: -6px; background: #f4f4f7; }
      #input {
        flex: 1;
        resize: none;
        padding: 9px 10px;
        font: inherit;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      #send { padding: 0 16px; border: none; background: #111; color: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; transition: background .25s linear; }
      #send:hover:not(:disabled) { background: #333; }             /* soften ~20% on hover */
      #send:disabled { opacity: 0.4; cursor: default; }

      /* ---- Preview / embedded browser ---- */
      #preview { flex: 1; background: #fff; position: relative; display: flex; flex-direction: column; }
      #browser { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #browser[hidden] { display: none; }
      #tabbar { display: flex; align-items: stretch; gap: 2px; padding: 4px 6px 0; background: #ececef; overflow-x: auto; }
      .tab {
        display: flex; align-items: center; gap: 6px; max-width: 180px; padding: 6px 8px;
        font-size: 12px; background: #dcdce1; border-radius: 6px 6px 0 0; cursor: pointer;
        color: #333; white-space: nowrap;
      }
      .tab.active { background: #fff; color: #111; }
      .tablabel { overflow: hidden; text-overflow: ellipsis; }
      .tabclose { border: none; background: none; cursor: pointer; color: #666666; font-size: 13px; line-height: 1; padding: 0 2px; }
      .tabclose:hover { color: #111; }
      .tabadd { border: none; background: none; cursor: pointer; font-size: 15px; color: #555; padding: 0 8px; }
      #navbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #fff; border-bottom: 1px solid #e6e6ea; }
      .navbtn { border: none; background: #f1f1f4; border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; color: #333; }
      .navbtn:hover { background: #e6e6ea; }
      #urlbar { flex: 1; padding: 5px 9px; font-size: 12px; border: 1px solid #d8d8de; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, monospace; color: #444; }
      /* Post-update recovery banner: shown after a design update, points at the tab
         reload, then a "Refresh Browser" recovery button (validate → reload/restart). */
      #preview-help { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: #fff8e1; border-bottom: 1px solid #f0e0a8; font-size: 12px; line-height: 1.4; color: #6b5a1e; }
      #preview-help[hidden] { display: none; }
      #preview-help b { font-weight: 600; }
      #preview-refresh { border: 1px solid #caa93a; background: #fff; color: #6b5a1e; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
      #preview-refresh:hover { background: #fdf3d0; }
      #preview-help-x { margin-left: auto; border: none; background: none; color: #a9962f; cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; }
      #preview-help-x:hover { color: #6b5a1e; }
      /* No-Claude-key reminder: shown in the preview browser in read-only mode. */
      #nokey-banner { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #eef4ff; border-bottom: 1px solid #cddcff; font-size: 12px; line-height: 1.4; color: #274690; }
      #nokey-banner[hidden] { display: none; }
      #nokey-banner b { font-weight: 600; }
      #nokey-banner-btn { margin-left: auto; border: 1px solid #3b5bdb; background: #3b5bdb; color: #fff; border-radius: 6px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
      #nokey-banner-btn:hover { background: #2f4bc0; }
      #quicklinks { display: flex; gap: 4px; }
      .qlink { border: 1px solid #d8d8de; background: #fafafb; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #333; white-space: nowrap; }
      .qlink:hover { border-color: #111; color: #111; }
      #views { flex: 1; position: relative; min-height: 0; }
      #views webview { width: 100%; height: 100%; }
      /* Home-tab progress cover (Style guide is live alongside it). */
      #buildoverlay {
        position: absolute; inset: 0; z-index: 5;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 32px;
        background: linear-gradient(180deg, #fbfbfd, #f4f4f7);
      }
      #buildoverlay[hidden] { display: none; }
      .bo-inner { max-width: 460px; }
      .bo-emoji { line-height: 0; margin-bottom: 18px; color: #111; }
      .bo-emoji svg { width: 44px; height: 44px; display: block; margin: 0 auto; }
      #bo-title { font-size: 19px; color: #1a1a1a; margin: 0 0 10px; }
      #bo-text { font-size: 14px; color: #666; margin: 0; line-height: 1.6; text-wrap: balance; }
      #buildoverlay .ph-progress { margin: 18px auto 0; }
      .bo-hint { font-size: 12.5px; color: #737373; margin-top: 16px; }
      /* "Point & comment" toggle — floats over the live preview. */
      #feedback-toggle {
        position: absolute; right: 16px; bottom: 16px; z-index: 10;
        display: inline-flex; align-items: center; gap: 0;
        padding: 9px; border-radius: 999px; border: none; cursor: pointer;
        background: #17171b; color: #fff; font-size: 12.5px; font-weight: 400;
        box-shadow: 0 4px 14px rgba(0,0,0,.22); transition: background .18s linear;
      }
      #feedback-toggle[hidden] { display: none; }
      #feedback-toggle:hover { background: #2a2a31; }
      #feedback-toggle.active { background: #fff; color: #17171b; box-shadow: 0 0 0 2px #17171b, 0 4px 14px rgba(0,0,0,.18); }
      #feedback-toggle svg { width: 15px; height: 15px; flex: 0 0 auto; }
      /* Collapsed to just the icon; the label slides open on hover (or while active). */
      #feedback-toggle-label {
        max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; margin-left: 0;
        transition: max-width .22s ease, opacity .18s ease, margin-left .22s ease;
      }
      #feedback-toggle:hover #feedback-toggle-label,
      #feedback-toggle.active #feedback-toggle-label {
        max-width: 170px; opacity: 1; margin-left: 6px;
      }
      #previewph {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 32px;
        background: linear-gradient(180deg, #fbfbfd, #f4f4f7);
      }
      #previewph[hidden] { display: none; }
      .ph-inner { max-width: 470px; }
      .ph-emoji { line-height: 0; margin-bottom: 18px; color: #111; }
      .ph-emoji svg { width: 44px; height: 44px; display: block; margin: 0 auto; }
      #ph-title { font-size: 19px; margin: 0 0 10px; color: #1a1a1a; }
      #ph-text { font-size: 14px; line-height: 1.6; color: #666; margin: 0; text-wrap: balance; }
      .ph-progress { width: 220px; height: 4px; background: #e4e4ea; border-radius: 4px; margin: 18px auto 0; overflow: hidden; }
      .ph-progress[hidden] { display: none; }
      .ph-progress-bar { width: 40%; height: 100%; background: #111; border-radius: 4px; animation: ph-bounce 2.3s ease-in-out infinite alternate; }
      /* Gentle back-and-forth (alternate + ease-in-out eases at each edge) — a
         calm, unhurried feel instead of a fast one-way sweep. */
      @keyframes ph-bounce { from { transform: translateX(0%); } to { transform: translateX(150%); } }

      /* Quiet-build narration spine: a determinate "Step N of M" with a segmented bar.
         Filled = done, the active segment carries the calm intra-phase shimmer so a long
         phase still shows life. See docs/quiet-build-narration-spec.md. */
      .ph-steplabel { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #74747a; margin-bottom: 10px; }
      .ph-steplabel[hidden] { display: none; }
      .ph-steps { display: flex; gap: 6px; width: 260px; margin: 18px auto 0; }
      .ph-steps[hidden] { display: none; }
      .ph-steps .seg { flex: 1 1 0; height: 4px; background: #e4e4ea; border-radius: 4px; position: relative; overflow: hidden; }
      .ph-steps .seg.done { background: #111; }
      .ph-steps .seg.active::after { content: ""; position: absolute; inset: 0; width: 45%; background: #111; border-radius: 4px; animation: ph-bounce 2.3s ease-in-out infinite alternate; }

      /* ---- Intake host (in-pane onboarding — T3/T4) ------------------------- */
      #intakeph {
        position: absolute; inset: 0; overflow-y: auto;
        background: linear-gradient(180deg, #fbfbfd, #f4f4f7);
      }
      #intakeph[hidden] { display: none; }
      .intake-inner { max-width: 560px; margin: 0 auto; padding: 48px 32px 64px; }
      .intake-head { margin-bottom: 22px; }
      #intake-title { font-size: 22px; margin: 0 0 8px; color: #1a1a1a; letter-spacing: -0.01em; }
      #intake-lead { font-size: 14px; line-height: 1.6; color: #666; margin: 0; text-wrap: balance; }
      /* "Your brief so far" — the Brief accumulated from answered cards (T5). Hidden
         by default; becomes the persistent left rail once the flow has content. */
      #intake-brief { display: none; }
      /* The two rail blocks (References + Brief) are each their own card. */
      .iref-panel, .ibrief-card {
        border: 1px solid #e3e3e9; border-radius: 12px; background: #fff;
        padding: 16px 18px; box-shadow: 0 1px 2px rgba(20,20,30,.03);
      }
      .ibrief-title { font-size: 12px; font-weight: 600; color: #111; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 11px; }
      .ibrief-row { display: flex; gap: 10px; font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
      .ibrief-row:last-child { margin-bottom: 0; }
      .ibrief-key { flex: 0 0 66px; color: #737373; }
      .ibrief-val { color: #1a1a1a; }
      #intake-stack { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }

      /* Design references panel (reference-ingest T0) — sits at the top of the rail;
         an upload/drop zone + a thumbnail grid of what's been captured. */
      .iref-title { font-size: 12px; font-weight: 600; color: #111; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
      .iref-hint { font-size: 12px; line-height: 1.5; color: #8a8a93; margin-bottom: 10px; }
      .iref-drop {
        display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
        border: 1px dashed #cfcfd8; border-radius: 10px; background: #fafafc;
        padding: 12px; cursor: pointer; font: inherit; font-size: 13px; color: #555;
        transition: border-color .12s, background .12s, color .12s;
      }
      .iref-drop:hover { border-color: #b3b3c0; color: #333; }
      .iref-drop.drag { border-color: #7b7bea; background: #f0f0ff; color: #4a4ad0; }
      .iref-plus { font-size: 15px; line-height: 1; }
      .iref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-top: 10px; }
      .iref-chip { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .iref-thumb {
        aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #f1f1f5;
        border: 1px solid #e6e6ec; display: flex; align-items: center; justify-content: center;
      }
      .iref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .iref-thumb.iref-glyph { font-size: 22px; }
      .iref-name { font-size: 11px; line-height: 1.3; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .iref-rm {
        position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border: none; border-radius: 999px; background: rgba(20,20,30,.62); color: #fff;
        font-size: 10px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s;
      }
      .iref-chip:hover .iref-rm { opacity: 1; }
      .iref-rm:hover { background: rgba(20,20,30,.85); }
      .iref-reading { font-size: 12px; color: #7b7bea; margin-top: 8px; animation: irefpulse 1.4s ease-in-out infinite; }
      @keyframes irefpulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .iref-feel { font-size: 12px; line-height: 1.5; color: #555; margin-top: 10px; font-style: italic; }
      /* Reference lightbox — full-size view on click, filename as caption. */
      .iref-lightbox {
        position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
        background: rgba(16,16,22,.72); padding: 40px; cursor: zoom-out;
        opacity: 0; transition: opacity .18s ease;
      }
      .iref-lightbox.show { opacity: 1; }
      .iref-lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 90vw; max-height: 90vh; cursor: default; }
      .iref-lb-fig img { max-width: 90vw; max-height: 80vh; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: block; }
      .iref-lb-glyph { font-size: 72px; }
      .iref-lb-open {
        border: none; border-radius: 999px; background: #fff; color: #222;
        padding: 8px 18px; font: inherit; font-size: 13px; cursor: pointer;
      }
      .iref-lb-open:hover { background: #f0f0f0; }
      .iref-lb-cap { font-size: 13px; color: #eee; text-align: center; word-break: break-all; max-width: 90vw; }
      .iref-palette { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .iref-palette-lbl { font-size: 11px; color: #737373; margin-right: 2px; }
      .iref-swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(20,20,30,.12); }

      /* Design-references help: a thin-line "?" in the card's upper-right opens an
         overlay explaining what ingest does + what works best. */
      .iref-panel { position: relative; }
      .iref-info {
        position: absolute; top: 11px; right: 12px; width: 22px; height: 22px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        border: none; background: none; color: #111; opacity: .38; cursor: pointer; transition: color .12s, opacity .12s;
      }
      .iref-info:hover { color: #6b6be0; opacity: 1; }
      .iref-info svg { width: 20px; height: 20px; display: block; }
      .iref-help {
        position: fixed; inset: 0; z-index: 7000; display: flex; align-items: center; justify-content: center;
        background: rgba(16,16,22,.72); padding: 40px; cursor: pointer;
        opacity: 0; transition: opacity .18s ease;
      }
      .iref-help.show { opacity: 1; }
      .iref-help-card {
        background: #fff; border-radius: 14px; width: min(480px, 92vw); max-height: 84vh; overflow-y: auto;
        padding: 22px 24px 22px; box-shadow: 0 18px 60px rgba(0,0,0,.42); cursor: default;
      }
      .iref-help-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      .iref-help-title { font-size: 15px; font-weight: 650; color: #111; }
      .iref-help-x {
        flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border: none; border-radius: 999px;
        background: #f2f2f5; color: #666; font-size: 15px; line-height: 1; cursor: pointer; transition: background .12s, color .12s;
      }
      .iref-help-x:hover { background: #e7e7ec; color: #222; }
      .iref-help-card h4 { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: #8a8a93; margin: 16px 0 6px; }
      .iref-help-card p { font-size: 13px; line-height: 1.6; color: #333; margin: 0 0 8px; }
      .iref-help-card ul { margin: 0 0 8px; padding-left: 18px; }
      .iref-help-card li { font-size: 13px; line-height: 1.55; color: #333; margin-bottom: 5px; }
      .iref-help-card b { color: #111; font-weight: 600; }
      .iref-help-note { font-size: 12px; line-height: 1.55; color: #8a8a93; margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; }
      /* Tabbed help cards (used by the design-direction "?"): a tab bar + panels, one visible. */
      .iref-help-tabs { display: flex; gap: 4px; margin: 4px 0 14px; border-bottom: 1px solid #eee; }
      .iref-help-tab {
        appearance: none; border: none; background: none; cursor: pointer; padding: 7px 10px 9px;
        font-size: 12.5px; font-weight: 600; color: #8a8a93; border-bottom: 2px solid transparent; margin-bottom: -1px;
        transition: color .12s, border-color .12s;
      }
      .iref-help-tab:hover { color: #444; }
      .iref-help-tab.active { color: #111; border-bottom-color: #111; }
      .iref-help-panel { display: none; }
      .iref-help-panel.active { display: block; }

      /* ---- Two-column flow: questions (left) + references/brief rail (right) ----
         The design intake runs in .flow (a flex row); `order` puts the questions
         left and the rail right. The rail starts collapsed (width 0) and, once it's
         revealed (after the first answer), .hasbrief animates it open while the
         questions column makes room. The PAIR is centered as a group
         (justify-content) with a fixed gutter between the columns, so on a wide
         pane both hug the centerline instead of drifting to their own sides
         (Rob 2026-09-09). The rail is pinned to the top and fixed; only the
         questions column scrolls. */
      #intakeph.flow { display: flex; justify-content: center; overflow: hidden; }
      #intakeph.flow .intake-inner {
        order: 1;   /* questions on the LEFT */
        flex: 1 1 640px; min-width: 0; max-width: 640px; margin: 0;
        height: 100%; overflow-y: auto; padding: 52px 40px 64px; /* the right padding is the gutter */
      }
      #intakeph.flow .intake-head { text-align: center; }
      /* The references / brief rail (right): collapsed to zero width + nudged down +
         transparent, then .hasbrief eases it open to a set width (440px, the questions column is 640px)
         and fades in. The lone questions column sits centered in the pane until the
         rail claims its space, then the pair re-centers and the questions drift
         LEFT. margin-right mirrors the questions column's left padding, ONLY when
         the rail is open (so the single column stays centered).
         A transparent flex COLUMN of its own cards, pinned to the top. */
      #intakeph.flow #intake-brief {
        order: 2;   /* references / brief on the RIGHT */
        display: flex; flex-direction: column; gap: 14px;
        align-self: flex-start; margin-top: 52px; box-sizing: border-box; /* pinned to the top */
        flex: 0 0 0%; margin-left: 0; margin-right: 0;
        opacity: 0; overflow: hidden;
        transform: translateY(24px); max-height: calc(100% - 76px);
        transition: flex-basis .62s cubic-bezier(.16,1,.3,1),
                    transform .62s cubic-bezier(.16,1,.3,1),
                    opacity .5s ease,
                    margin-left .62s cubic-bezier(.16,1,.3,1),
                    margin-right .62s cubic-bezier(.16,1,.3,1);
      }
      #intakeph.flow.hasbrief #intake-brief {
        flex: 0 1 440px; margin-left: 0; margin-right: 40px; /* a set width, like the questions column; shrinks only when the pane is too narrow */
        opacity: 1; transform: translateY(0);
        overflow-y: auto;
      }

      /* A card group = one intake() call's cards + its Continue button. */
      .intake-group { display: flex; flex-direction: column; gap: 14px; }
      /* Company Profile drawer form: same column + gap as the intake cards. The
         [hidden] rule stays higher-specificity so the Create/Update toggle still hides it. */
      .company-form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
      .company-form[hidden] { display: none; }
      .intake-group.answered .icard, .intake-group.answered .intake-continue { pointer-events: none; }

      /* Start fork — two side-by-side choice cards, centered in the pane with the
         intro text centered above them (only in the start state, not the flow). */
      #intakeph.start { display: flex; flex-direction: column; justify-content: center; }
      #intakeph.start .intake-head { text-align: center; margin-bottom: 26px; }
      /* Back — steps through the flow (top-left of the pane). */
      #intake-back {
        position: absolute; top: 16px; left: 16px; z-index: 6;
        display: inline-flex; align-items: center; gap: 5px;
        background: #fff; border: 1px solid #e0e0e6; border-radius: 999px;
        padding: 6px 13px 6px 10px; cursor: pointer; font: inherit; font-size: 12.5px;
        color: #444; transition: border-color .12s, color .12s;
      }
      #intake-back:hover { border-color: #111; color: #111; }
      #intake-back[hidden] { display: none; }
      #intake-back svg { width: 15px; height: 15px; }
      .istart-row { display: flex; gap: 14px; }
      .istart-card {
        flex: 1 1 0; text-align: left; cursor: pointer;
        /* Top-align content: buttons vertically-center their content by default, so
           in an equal-height row the shorter card's icon/label would sit lower than
           the taller one's. Flex-column + flex-start keeps both anchored at the top. */
        display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
        border: 1px solid #e3e3e9; border-radius: 14px; padding: 20px 18px 18px;
        background: #fff; box-shadow: 0 1px 2px rgba(20,20,30,.03);
        transition: border-color .12s, box-shadow .12s, transform .06s;
      }
      .istart-card:hover { border-color: #111; box-shadow: 0 6px 20px rgba(0,0,0,.10); }
      .istart-card:active { transform: translateY(1px); }
      .istart-icon { display: block; width: 26px; height: 26px; color: #111; margin-bottom: 12px; }
      .istart-icon svg { width: 26px; height: 26px; display: block; stroke-width: 1; }
      .istart-label { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
      .istart-desc { font-size: 12.5px; line-height: 1.5; color: #777; }
      /* Centered variant — the Website / App type fork (icon over label). Both icons
         render at the same fixed height so the two labels sit on the same line. */
      .istart-card.istart-center { text-align: center; }
      .istart-center .istart-icon { display: flex; align-items: flex-end; justify-content: center; width: auto; height: 26px; margin: 0 0 12px; }
      .istart-center .istart-icon svg { width: auto; height: 26px; }
      /* The Figma brand mark is taller than wide — keep its aspect, don't square it. */
      .istart-icon-figma { width: auto; }
      .istart-icon-figma svg { width: auto; height: 24px; }

      /* "Start from Figma" frame-link screen (enterFigmaStartMode). */
      .ifigma-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(520px, 92%); margin: 0 auto; }
      .ifigma-url {
        width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid #d9d9e0;
        background: #fff; color: #1a1a1a; font-size: 14px; outline: none;
        transition: border-color .12s, box-shadow .12s;
      }
      .ifigma-url::placeholder { color: #aaa; }
      .ifigma-url:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(17,17,17,.06); }
      .ifigma-err { align-self: flex-start; color: #d8564f; font-size: 12.5px; }
      .ifigma-import {
        padding: 11px 30px; border-radius: 999px; border: none; cursor: pointer;
        background: #111; color: #fff; font-size: 14px; font-weight: 600;
        transition: opacity .12s, transform .06s;
      }
      .ifigma-import:hover { opacity: .9; }
      .ifigma-import:active { transform: translateY(1px); }
      .ifigma-import:disabled { opacity: .55; cursor: default; }
      /* Export Design action in the Figma drawer — solid, full-width, gated on the license */
      .ifigma-export {
        display: block; width: 100%; margin: 14px 0 4px;
        padding: 11px 20px; border-radius: 10px; border: none;
        background: #111; color: #fff; font-size: 14px; font-weight: 400; cursor: pointer;
        transition: opacity .12s, transform .06s;
      }
      .ifigma-export:hover:not(:disabled) { opacity: .9; }
      .ifigma-export:active:not(:disabled) { transform: translateY(1px); }
      .ifigma-export:disabled { opacity: .45; cursor: default; }
      .ifigma-skip { margin-top: 2px; background: none; border: none; color: #737373; font-size: 12.5px; cursor: pointer; }
      .ifigma-skip:hover { color: #555; text-decoration: underline; }

      /* Ingest working state — three pulsing dots. */
      .ifigma-working { display: flex; gap: 8px; justify-content: center; padding: 10px 0; }
      .ifigma-working i { width: 9px; height: 9px; border-radius: 50%; background: #111; opacity: .25; animation: ifigmaPulse 1.1s ease-in-out infinite; }
      .ifigma-working i:nth-child(2) { animation-delay: .18s; }
      .ifigma-working i:nth-child(3) { animation-delay: .36s; }
      @keyframes ifigmaPulse { 0%, 80%, 100% { opacity: .2; transform: scale(.85); } 40% { opacity: .9; transform: scale(1); } }

      /* Ingest findings — badge, palette swatches, type, caveats. */
      .ifigma-findings { width: min(560px, 92%); margin: 4px auto 18px; text-align: left; }
      .ifigma-badge {
        display: inline-block; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
        background: #f2f2f5; color: #333; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      }
      .ifigma-flabel { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: #8a8a93; margin: 14px 0 6px; }
      .ifigma-swatches { display: flex; flex-wrap: wrap; gap: 6px; }
      .ifigma-swatch { width: 26px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
      .ifigma-fval { font-size: 13px; color: #333; }
      .ifigma-flags { margin: 14px 0 0; padding-left: 18px; }
      .ifigma-flags li { font-size: 12px; line-height: 1.5; color: #8a8a93; margin-bottom: 4px; }
      /* Build-fidelity toggle on the findings screen (onboard main pane). */
      .ifigma-fidelity { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: min(560px, 92%); margin: 18px auto 6px; padding: 12px 14px; border: 1px solid #eee; border-radius: 10px; }
      .ifigma-fidelity-lbl { font-size: 13px; font-weight: 600; color: #222; }
      .ifigma-fidelity-state { font-size: 12px; color: #8a8a93; margin-top: 2px; }
      /* Custom-font upload prompt (non-web face from the import). */
      .ifigma-fontup { margin-top: 14px; padding: 12px 14px; border: 1px dashed #d2d2da; border-radius: 10px; background: #fafafb; }
      .ifigma-fontup-lead { font-size: 12.5px; line-height: 1.5; color: #444; margin-bottom: 9px; }
      .ifigma-fontup-btn {
        padding: 7px 14px; border-radius: 8px; border: 1px solid #d9d9e0; background: #fff; cursor: pointer;
        font-size: 12.5px; font-weight: 600; color: #222; transition: border-color .12s, background .12s;
      }
      .ifigma-fontup-btn:hover { border-color: #111; background: #fafafa; }
      .ifigma-fontup-btn:disabled { opacity: .55; cursor: default; }
      .ifigma-fontup-note { margin-top: 8px; font-size: 12px; color: #3a7d44; }

      /* Read-only answer, shown once a card is submitted (feedback #2). */
      .icard-answer { font-size: 13.5px; line-height: 1.55; color: #1a1a1a; white-space: pre-wrap; }
      .icard-answer.empty { color: #aaa; font-style: italic; }

      /* Click-to-edit: a collapsed card can be re-opened even though its group is
         "answered" (which otherwise disables pointer events). Hover lifts the card with a
         subtle shadow (no copy recolor); "Edit" sits in the card's lower-right, in green. */
      .intake-group.answered .icard.collapsed { pointer-events: auto; cursor: pointer; transition: box-shadow .18s ease; }
      .intake-group.answered .icard.collapsed:hover { box-shadow: 0 4px 14px rgba(0,0,0,.10); }
      .intake-group.editing .icard,
      .intake-group.editing .intake-continue { pointer-events: auto; }
      .intake-edit {
        display: block;
        width: fit-content;
        margin: 8px 0 0 auto;   /* inside the card, tucked to the lower-right */
        background: none; border: none; padding: 0;
        font: inherit; font-size: 12.5px; color: #0a7; cursor: pointer;
      }
      .intake-edit:hover { text-decoration: underline; }
      .intake-group.editing .intake-edit { display: none; }

      .icard {
        position: relative; /* a card-corner control (the direction card's help buoy) anchors here */
        border: 1px solid #e3e3e9; border-radius: 12px; padding: 16px 16px 15px;
        background: #fff; box-shadow: 0 1px 2px rgba(20,20,30,.03);
      }
      .icard-label { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
      .icard-help { font-size: 12.5px; color: #666666; margin-bottom: 11px; line-height: 1.5; }
      .icard-label + .icard-body { margin-top: 11px; }
      .icard.skipped { opacity: 0.55; }

      /* open-text */
      .icard-input, .icard-textarea {
        width: 100%; border: 1px solid #d8d8de; border-radius: 8px;
        padding: 9px 11px; font: inherit; font-size: 13.5px; color: #1a1a1a;
        background: #fff; box-sizing: border-box; resize: none; line-height: 1.5;
      }
      .icard-input:focus, .icard-textarea:focus { outline: none; border-color: #111; box-shadow: 0 0 0 3px #ececf1; }
      .icard-textarea { min-height: 96px; }
      .icard-counter { font-size: 11.5px; color: #aaa; text-align: right; margin-top: 5px; }
      .icard-counter.over { color: #d33; }

      /* single / multi choice — bordered rows */
      .iopt {
        display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
        border: 1px solid #e0e0e6; border-radius: 9px; padding: 10px 12px; margin-bottom: 8px;
        background: #fff; cursor: pointer; transition: border-color .12s, background .12s;
      }
      .iopt:last-child { margin-bottom: 0; }
      .iopt:hover { border-color: #111; }
      .iopt.selected { border-color: #111; background: #111; }
      .iopt-check {
        flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; border-radius: 5px;
        border: 1.5px solid #c8c8d0; display: flex; align-items: center; justify-content: center;
        color: #fff; line-height: 1;
      }
      .iopt-check svg { width: 11px; height: 11px; display: block; }
      .iopt.radio .iopt-check { border-radius: 50%; }
      .iopt.selected .iopt-check { background: #fff; border-color: #fff; color: #111; }
      .iopt.selected .iopt-label { color: #fff; }
      .iopt-label { font-size: 13.5px; color: #1a1a1a; }

      /* chips — compact multi-select (black border + text, solid black when selected) */
      .ichips { display: flex; flex-wrap: wrap; gap: 8px; }
      .ichip {
        border: 1px solid #111; border-radius: 999px; padding: 6px 13px;
        font-size: 13px; color: #111; background: #fff; cursor: pointer;
        transition: background .12s, color .12s;
      }
      .ichip:hover { background: #f4f4f7; }
      .ichip.selected { border-color: #111; background: #111; color: #fff; }
      /* read-only "applied" pills (e.g. global copy rules already in effect) */
      .ichip.applied { cursor: default; border: 1px dashed #cfcfd6; color: #666; background: #f7f7f9; }
      .ichip.applied:hover { background: #f7f7f9; }
      /* global-rule pills: pre-selected + toggleable; unselecting one skips it here */
      .ichip.global:not(.selected) { border-style: dashed; border-color: #cfcfd6; color: #737373; text-decoration: line-through; }
      .voice-applied-note { font-size: 12px; color: #666666; margin: 0 0 8px; }

      /* hero-layout — single-select wireframe chips (black border, SVG + caption below) */
      .ihero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .ihero-chip {
        display: flex; flex-direction: column; align-items: stretch; gap: 8px;
        padding: 0; background: transparent; border: none; cursor: pointer; text-align: center;
      }
      .ihero-art {
        display: block; border: 1px solid #111; border-radius: 8px; background: #fff;
        padding: 8px; transition: box-shadow .12s, background .12s, transform .1s;
      }
      .ihero-art svg { display: block; width: 100%; height: auto; }
      .ihero-chip:hover .ihero-art { background: #f4f4f7; }
      .ihero-chip:active .ihero-art { transform: translateY(1px); }
      .ihero-chip.selected .ihero-art { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #111; }
      .ihero-cap { font-size: 12.5px; color: #1a1a1a; }
      .ihero-chip.selected .ihero-cap { font-weight: 600; }
      .ihero-chip:disabled { cursor: default; opacity: .5; }

      /* menu-layout — grouped wireframe chips (Simple / Dropdown / Mega), reuses .ihero */
      .imenu-group-label { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: #1a1a1a; margin: 16px 0 9px; }
      .imenu-group-label:first-child { margin-top: 0; }
      .imenu-grid { margin-bottom: 2px; }

      /* color-swatch — pick one primary color */
      .iswatches { display: flex; flex-wrap: wrap; gap: 10px; }
      .iswatch { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .1s, box-shadow .12s; }
      .iswatch:hover { transform: scale(1.08); }
      .iswatch.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #111, inset 0 0 0 1px rgba(0,0,0,.1); }
      .iswatch:disabled { cursor: default; }
      /* true color picker — rainbow "custom" swatch until a color is chosen */
      .iswatch-custom { position: relative; overflow: hidden; background: conic-gradient(from 0deg, #f5504e, #f5c04e, #7bd15a, #4ec6f5, #6a6af5, #d15ad1, #f5504e); }
      .iswatch-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: none; padding: 0; margin: 0; cursor: pointer; }

      /* font-pick — pick one font, shown in its own typeface */
      .ifonts { display: flex; flex-direction: column; gap: 8px; }
      .ifont { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid #e0e0e6; border-radius: 9px; padding: 9px 14px; background: #fff; cursor: pointer; color: #1a1a1a; transition: border-color .12s, background .12s, color .12s; }
      .ifont:hover { border-color: #111; }
      .ifont.selected { border-color: #111; background: #111; color: #fff; }
      .ifont-preview { font-size: 25px; line-height: 1; flex: 0 0 auto; }
      .ifont-name { font-size: 13.5px; font-family: system-ui, sans-serif; }
      .ifont-custom { display: flex; gap: 8px; margin-top: 8px; }
      .ifont-custom .icard-input { flex: 1 1 auto; }
      .ifont-add { flex: 0 0 auto; border: 1px solid #111; border-radius: 9px; padding: 0 16px; background: #111; color: #fff; font-size: 13px; cursor: pointer; transition: opacity .12s; }
      .ifont-add:hover { opacity: .85; }
      .ifont-add:disabled { opacity: .4; cursor: default; }
      /* Upload-a-font-file: a full-width row under the font list (dashed, to read as an upload
         affordance distinct from the solid selectable rows), above the "or type" input. */
      .ifont-upload { display: block; width: 100%; margin-top: 8px; text-align: center; border: 1px dashed #c9c9d2; border-radius: 9px; padding: 10px 14px; background: #fafafb; color: #555; font-size: 13px; cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
      .ifont-upload:hover { border-color: #111; color: #111; }
      .ifont-upload:disabled { opacity: .4; cursor: default; }

      /* reference — up to 3 url + why entries */
      .iref-field { margin-bottom: 9px; }
      .iref-field:last-child { margin-bottom: 0; }
      .iref-cap { font-size: 12px; color: #666666; margin-bottom: 5px; }
      .iref-entry { position: relative; padding: 12px; border: 1px dashed #e0e0e6; border-radius: 9px; margin-bottom: 10px; }
      .iref-entry:first-child { padding: 0; border: none; margin-bottom: 10px; }
      .iref-remove {
        position: absolute; top: 8px; right: 8px; background: none; border: none; padding: 2px 4px;
        cursor: pointer; font: inherit; font-size: 11.5px; color: #b0b0b8;
      }
      .iref-remove:hover { color: #d33; }
      .iref-add {
        margin-top: 2px; background: none; border: 1px dashed #c8c8d0; border-radius: 8px;
        padding: 7px 12px; cursor: pointer; font: inherit; font-size: 12.5px; color: #111;
      }
      .iref-add:hover { background: #f4f4f7; border-color: #111; }
      .iref-add[hidden] { display: none; }

      /* per-card skip + per-group continue */
      .icard-skip {
        margin-top: 10px; background: none; border: none; padding: 0; cursor: pointer;
        font: inherit; font-size: 12px; color: #737373; text-decoration: none;
      }
      .icard-skip:hover { color: #111; text-decoration: underline; }
      .icard-skip.undo { color: #737373; }
      .intake-continue {
        align-self: flex-start; border: none; border-radius: 8px; padding: 9px 20px;
        background: #111; color: #fff; font: inherit; font-size: 13.5px; font-weight: 600;
        cursor: pointer; transition: opacity .12s;
      }
      .intake-continue:disabled { opacity: 0.4; cursor: default; }
      .intake-done {
        font-size: 12.5px; color: #111; font-weight: 600; padding: 2px 0;
        overflow: hidden; transition: opacity .3s ease, max-height .3s ease, padding .3s ease;
      }
      .intake-done.fade-out { opacity: 0; padding-top: 0; padding-bottom: 0; }
      /* Conversational "thinking" line shown in the pane between question batches. */
      .intake-pending {
        display: flex; align-items: center; gap: 9px;
        font-size: 13.5px; line-height: 1.5; color: #666; padding: 4px 2px;
      }
      .intake-pending-dots { display: inline-flex; gap: 4px; flex: 0 0 auto; }
      .intake-pending-dots i {
        width: 5px; height: 5px; border-radius: 50%; background: #111; opacity: .25;
        animation: ta-think 1.1s infinite ease-in-out both;
      }
      .intake-pending-dots i:nth-child(2) { animation-delay: .18s; }
      .intake-pending-dots i:nth-child(3) { animation-delay: .36s; }

      /* Head hidden during the brief-complete review state. */
      .intake-hidden { display: none !important; }

      /* Brief-complete review: center the actions vertically so they sit level with
         the (vertically-centered) brief rail, not at the top of the pane. */
      #intakeph.reviewing .intake-inner { display: flex; flex-direction: column; justify-content: center; }
      .intake-review { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
      /* The Design References introduction card: the rail's panel inside a card (the card
         supplies the frame, and the help buoy anchors to the card's corner), and the
         floating copy that travels from the card to the rail on Continue. */
      .icard-refs .iref-panel { position: static; border: 0; padding: 0; background: transparent; box-shadow: none; }
      .iref-ghost { position: fixed; z-index: 60; margin: 0; pointer-events: none; transform-origin: top left; box-shadow: 0 10px 34px rgba(20,20,30,.18); }
      /* The pick-up offer on the deliverable screen (a saved intake for this project). */
      .iresume { width: 100%; max-width: 520px; margin: 0 auto 26px; padding: 16px 18px; border: 1px solid #e3e3e9; border-radius: 12px; background: #fff; text-align: left; box-shadow: 0 1px 2px rgba(20,20,30,.03); }
      .iresume-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
      .iresume-detail { font-size: 12.5px; color: #666; line-height: 1.5; margin: 4px 0 12px; }
      .iresume-actions { display: flex; align-items: center; gap: 12px; }
      .iresume-actions .intake-continue { margin: 0; width: auto; }
      .intake-review-q { font-size: 16px; font-weight: 600; color: #1a1a1a; line-height: 1.45; margin-bottom: 2px; text-wrap: balance; }

      /* P2: design-direction knob panel */
      .idir-host { width: 100%; }
      .idir { position: relative; width: 100%; border: 1px solid #e4e4ea; border-radius: 12px; padding: 16px 18px; background: #fbfbfd; box-sizing: border-box; transition: opacity .12s; }
      /* As a card in the intake stack (the Design direction step) the panel keeps its
         controls but not its own frame or title: the card supplies both. */
      .idir.idir-in-card { position: static; border: 0; border-radius: 0; padding: 0; background: transparent; }
      .idir.idir-in-card .idir-head { display: none; }
      /* Its help buoy sits where the Design References card keeps its own: the card's top-right corner. */
      .idir.idir-in-card .idir-info { top: 11px; right: 12px; color: #111; opacity: .38; transition: color .12s, opacity .12s; }
      .idir.idir-in-card .idir-info:hover { color: #6b6be0; opacity: 1; }
      .idir.idir-in-card .idir-info svg { width: 20px; height: 20px; }
      .idir.busy { opacity: .55; }
      .idir-head { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #74747a; margin-bottom: 6px; }
      .idir-lens { font-family: var(--admin-font-heading, Georgia, serif); font-size: 19px; font-weight: 700; color: #111; line-height: 1.2; }
      .idir-lens-sel { display: inline-block; border: none; background: none; padding: 0; cursor: pointer; text-align: left; font-family: var(--admin-font-heading, Georgia, serif); }
      .idir-lens-sel:hover { text-decoration: underline; text-underline-offset: 3px; }
      .idir-menu { position: absolute; z-index: 10; top: 62px; left: 18px; right: 18px; max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid #e0e0e6; border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.16); padding: 6px; }
      .idir-menu-group { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a6a6ae; padding: 8px 8px 4px; }
      .idir-menu-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 8px; border-radius: 6px; font: inherit; font-size: 13.5px; color: #1a1a1a; cursor: pointer; }
      .idir-menu-item:hover { background: #f2f2f5; }
      .idir-info { position: absolute; top: 12px; right: 13px; width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: none; color: #74747a; cursor: pointer; transition: color .12s; z-index: 2; }
      .idir-info:hover { color: #111; }
      .idir-info svg { width: 18px; height: 18px; display: block; }
      .idir-desc { font-size: 12.5px; color: #6a6a72; line-height: 1.45; margin-top: 3px; }
      .idir-axes { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 4px; }
      .idir-axis-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #74747a; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
      /* "i" info affordance on each LEVER label + its hover/focus tooltip. Distinct from
         .idir-info (the panel's absolute "?" help trigger). Sits slightly above + right of
         the label, like a superscript marker. */
      .idir-lev { position: relative; display: inline-flex; align-items: center; color: #b6b6bd; cursor: help; align-self: flex-start; margin-top: -4px; }
      .idir-lev:hover, .idir-lev:focus-visible { color: #111; outline: none; }
      .idir-lev-ic { display: inline-flex; }
      .idir-lev-ic svg { width: 15px; height: 15px; display: block; }
      /* Anchored to the icon and extending RIGHT (never past the panel's left edge on
         narrow windows). The arrow stays over the "i". */
      .idir-lev-tip {
        position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-16px) translateY(3px);
        width: max-content; max-width: 220px; padding: 8px 10px; border-radius: 7px;
        background: #111; color: #fff; font-size: 11.5px; font-weight: 400; letter-spacing: 0;
        text-transform: none; line-height: 1.45; text-align: left; white-space: normal;

        transition: opacity .12s, transform .12s; z-index: 40;
      }
      .idir-lev-tip::after {
        content: ""; position: absolute; top: 100%; left: 16px; transform: translateX(-50%);
        border: 5px solid transparent; border-top-color: #111;
      }
      .idir-lev:hover .idir-lev-tip, .idir-lev:focus-visible .idir-lev-tip { opacity: 1; transform: translateX(-16px) translateY(0); }
      .idir-stops { display: flex; gap: 4px; }
      .idir-stop { flex: 1 1 0; min-width: 0; border: 1px solid #e0e0e6; border-radius: 7px; padding: 6px 4px; background: #fff; color: #555; font: inherit; font-size: 11.5px; text-transform: capitalize; cursor: pointer; transition: border-color .12s, background .12s, color .12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .idir-stop:hover { border-color: #111; color: #111; }
      .idir-stop.active { background: #111; border-color: #111; color: #fff; }
      .idir-reroll { margin-top: 12px; border: 1px solid #d8d8de; border-radius: 8px; padding: 7px 14px; background: none; color: #333; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .12s, color .12s; }
      .idir-reroll:hover { border-color: #111; color: #111; }
      .idir-reroll:disabled { opacity: .5; cursor: default; }

      /* Post-build reroll: toolbar button + overlay */
      #reroll-btn { flex: 0 0 auto; margin-left: 6px; border: 1px solid #111; border-radius: 7px; padding: 4px 11px; background: #111; color: #fff; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity .12s; }
      #reroll-btn:hover { opacity: .85; }
      .reroll-overlay { position: fixed; inset: 0; z-index: 6000; background: rgba(20,20,26,.42); display: flex; align-items: center; justify-content: center; padding: 24px; }
      .reroll-card { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.28); box-sizing: border-box; }
      .reroll-title { font-family: var(--admin-font-heading, Georgia, serif); font-size: 22px; font-weight: 700; color: #111; }
      .reroll-sub { font-size: 13px; color: #6a6a72; line-height: 1.45; margin: 4px 0 16px; }
      .reroll-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
      .reroll-cancel { border: 1px solid #d8d8de; border-radius: 8px; padding: 9px 18px; background: none; color: #333; font: inherit; font-size: 13.5px; cursor: pointer; transition: border-color .12s, color .12s; }
      .reroll-cancel:hover { border-color: #111; color: #111; }
      .reroll-create { border: 1px solid #111; border-radius: 8px; padding: 9px 20px; background: #111; color: #fff; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: opacity .12s; }
      .reroll-create:hover { opacity: .85; }
      .ireview-secondary {
        align-self: flex-start; background: none; border: 1px solid #d8d8de; border-radius: 8px;
        padding: 9px 18px; font: inherit; font-size: 13.5px; color: #333; cursor: pointer;
        transition: border-color .12s, color .12s;
      }
      .ireview-secondary:hover { border-color: #111; color: #111; }
      .ireview-secondary[hidden] { display: none; }
      .ireview-more { display: flex; flex-direction: column; gap: 10px; width: 100%; }
      .ireview-more[hidden] { display: none; }
      .ireview-more .icard-textarea { min-height: 84px; }

      <div id="chat">

          <span id="barright">
            <span id="status">…</span>
          </span>

        <!-- Chat -->
        <div id="chatmain" hidden>
          <div id="log"></div>
          <div id="composer">
            <button id="scrolldown" type="button" data-copy-title="composer.jumpLatest" data-copy-aria="composer.jumpLatest">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="composer-left">
              <button id="cmdbtn" type="button" aria-haspopup="true" aria-expanded="false" data-copy-title="composer.commands">
                <svg class="cmd-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
              </button>
              <button id="attach" data-copy-title="composer.attach" data-copy-aria="composer.attachAria">
                <svg viewBox="0 -3.34 50 49.68" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path vector-effect="non-scaling-stroke" stroke-width="1" d="M36.025,19.506L20.202,35.329c-7.823,7.823-18.078-1.494-9.786-9.785c2.753-2.753,20.716-20.716,20.716-20.716c10.16-10.16,23.429,3.482,13.456,13.455c-3.363,3.364-20.716,20.715-20.716,20.715C10.519,52.351-6.795,35.974,7.025,22.154L22.849,6.331"/></svg>

            <button id="send" data-copy="composer.send"></button>
          </div>
        </div>
      </div>

      <div id="dragbar" data-copy-title="chrome.dragResize"></div>

      <div id="preview">
        <div id="browser" hidden>
          <div id="tabbar"></div>
          <div id="navbar">
            <button class="navbtn" id="navback" data-copy-title="nav.back">‹</button>
            <button class="navbtn" id="navfwd" data-copy-title="nav.forward">›</button>
            <button class="navbtn" id="navreload" data-copy-title="nav.reload">⟳</button>
            <input id="urlbar" spellcheck="false" />
            <span id="quicklinks">
              <button class="qlink" data-nav="home" data-copy="nav.home"></button>
              <button class="qlink" data-nav="styleguide" data-copy="nav.styleguide"></button>
              <button class="qlink" data-nav="dashboard" data-copy="nav.dashboard"></button>
            </span>
            <button id="reroll-btn" hidden data-copy="reroll.toolbarBtn"></button>
          </div>
          <div id="preview-help" hidden>
            <span data-copy-html="previewHelp.blankHtml"></span>
            <button id="preview-refresh" data-copy="previewHelp.refresh"></button>
            <button id="preview-help-x" data-copy-title="previewHelp.dismiss">✕</button>
          </div>
          <div id="nokey-banner" hidden>
            <span data-copy-html="nokeyBanner.text"></span>
            <button id="nokey-banner-btn" data-copy="nokeyBanner.button"></button>
          </div>
          <div id="views">
            <!-- Progress cover for the Home tab while it's still being designed
                 (the Style guide tab is live). Scoped INSIDE #views so the tab bar
                 stays usable; the home webview is display:none behind it. -->
            <div id="buildoverlay" hidden>
              <div class="bo-inner">
                <div class="bo-emoji">✨</div>
                <div id="bo-title" data-copy="buildOverlay.title"></div>
                <div id="bo-text"></div>
                <div class="ph-progress"><div class="ph-progress-bar"></div></div>
                <div class="bo-hint" data-copy="buildOverlay.hint"></div>
              </div>
            </div>
            <button id="feedback-toggle" hidden data-copy-title="feedback.toggleTitle" data-copy-aria="feedback.toggleAria">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
              <span id="feedback-toggle-label" data-copy="feedback.label"></span>
            </button>
          </div>
        </div>
        <div id="previewph">
          <div class="ph-inner">
            <div class="ph-emoji">👋</div>
            <div class="ph-steplabel" id="ph-steplabel" hidden></div>
            <h2 id="ph-title" data-copy="preview.noProject.title"></h2>
            <p id="ph-text" data-copy="preview.noProject.text"></p>
            <div class="ph-steps" id="ph-steps" hidden></div>
            <div class="ph-progress" id="ph-progress" hidden><div class="ph-progress-bar"></div></div>
          </div>
        </div>
        <!-- Intake host — the in-pane onboarding conversation (T3). The agent's
             intake() cards render here as a centered card column; the chat rail
             stays docked. Hidden until an intake begins. -->
        <div id="intakeph" hidden>
          <!-- Step back through the flow (questioning → what-are-we-making fork). -->
          <button id="intake-back" hidden type="button" data-copy-aria="nav.back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span data-copy="nav.back"></span>
          </button>
          <!-- Left rail (appears once the brief has content): a persistent
               reference while the questions on the right keep scrolling. -->
          <div id="intake-brief"></div>
          <div class="intake-inner">
            <div class="intake-head">
              <h2 id="intake-title" data-copy-html="intake.gathering.headTitle"></h2>
              <p id="intake-lead" data-copy-html="intake.gathering.headSubtitle"></p>
            </div>
            <div id="intake-stack"></div>
          </div>
        </div>

        <!-- Onboarding gates live in the big pane (not the chat pane) so first-run
             and reconnect present them centered here while the chat is collapsed.
             Connecting eases the chat pane open; the gate fades out. Text is keyed
             via data-copy and populated from window.COPY by applyStaticCopy. -->
        <div id="usagegate" class="gate" hidden>
          <div class="gate-inner gate-wide">
            <h2 data-copy="usageGate.heading"></h2>
            <p data-copy="usageGate.intro"></p>
            <div class="istart-row gate-cards">
              <button id="usage-personal" type="button" class="istart-card istart-center">
                <span class="istart-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
                <div class="istart-label" data-copy="usageGate.personalLabel"></div>
                <div class="istart-desc" data-copy="usageGate.personalDesc"></div>
              </button>
              <button id="usage-company" type="button" class="istart-card istart-center">
                <span class="istart-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9.5" r="2.6"/><path d="M2.5 20c0-3.4 2.5-6 5.5-6s5.5 2.6 5.5 6"/><path d="M14.5 19.5c.2-2.6 1.6-4.6 3.8-4.6 1.9 0 3.2 1.6 3.2 4.1"/></svg></span>
                <div class="istart-label" data-copy="usageGate.companyLabel"></div>
                <div class="istart-desc" data-copy="usageGate.companyDesc"></div>
              </button>
            </div>
          </div>
        </div>

        <div id="keygate" class="gate" hidden>
          <div class="gate-inner">
            <h2 id="keygate-title" data-copy="keygate.heading"></h2>
            <p id="keygate-intro" data-copy="keygate.intro"></p>
            <input id="keyinput" class="field" type="password" autocomplete="off" spellcheck="false" data-copy-ph="keygate.placeholder" />
            <button id="keysave" class="btn-primary" data-copy="keygate.save"></button>
            <div id="keyerror" class="gate-error"></div>
            <a id="keygate-link" class="gate-link" href="https://platform.claude.com/" data-external data-copy="keygate.getKeyLink"></a>
            <p id="keygate-note" class="gate-note" data-copy-html="keygate.note"></p>
          </div>
        </div>

        <div id="projectgate" class="gate" hidden>
          <div class="gate-inner">
            <h2 id="projectgate-title" data-copy="projectGate.heading"></h2>
            <p id="projectgate-intro" data-copy="projectGate.intro"></p>
            <button id="createproject" class="btn-primary" data-copy="projectGate.create"></button>
            <button id="openproject" class="btn-ghost" data-copy="projectGate.open"></button>
            <div id="projecterror" class="gate-error"></div>
            <p id="projectgate-note" class="gate-note" data-copy="projectGate.note"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="modal" hidden>
