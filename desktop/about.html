<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>About thinkany design</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff; color: #17171b;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 26px 24px 22px; text-align: center;
        -webkit-user-select: none; user-select: none;
      }
      .logo { width: 76px; height: 76px; margin-bottom: 14px; -webkit-user-drag: none; }
      .name { font-size: 17px; font-weight: 600; margin: 0 0 3px; letter-spacing: -0.2px; }
      .ver { font-size: 12.5px; color: #8a8a90; margin: 0 0 18px; }
      .btn {
        display: inline-block; text-decoration: none;
        background: #111; color: #fff; font-size: 12.5px; font-weight: 600;
        padding: 8px 16px; border-radius: 8px; cursor: pointer;
        transition: background .25s linear;   /* match the app's hovers */
      }
      .btn:hover { background: #333; }         /* soften ~20% */
      .copy { margin-top: 18px; font-size: 10.5px; color: #b4b4ba; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1f; color: #f2f2f4; }
        .ver { color: #9a9aa0; }
        .copy { color: #5c5c64; }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="build/icon.png" alt="thinkany design" />
    <h1 class="name">thinkany design</h1>
    <p class="ver" id="ver">Version</p>
    <a class="btn" href="https://thinkany.co" target="_blank" rel="noopener">Visit thinkany.co</a>
    <div class="copy">© thinkany</div>
    <script>
      // Version is passed in via the loadFile search param (no preload needed).
      var v = new URLSearchParams(location.search).get("v");
      if (v) document.getElementById("ver").textContent = "Version " + v;
    </script>
  </body>
</html>
